<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zona Cero — supervivencia zombie con GPS">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zona Cero">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zona Cero</title>
  <meta name="theme-color" content="#05070A">
  <style>
    html,body{background:#05070A;margin:0}
    /* Créditos del mapa (OSM/OpenFreeMap): visibles pero discretos, en la estética de la terminal. */
    .maplibregl-ctrl-attrib{background:rgba(5,7,10,.72)!important;font:9px/1.3 monospace!important;color:#62777E!important;border-radius:0!important}
    .maplibregl-ctrl-attrib a{color:#A4B8BD!important}
    .maplibregl-ctrl-top-right{top:auto!important;bottom:118px!important;right:4px!important}
  </style>
  <link rel="manifest" href="manifest.json">

<body>
  <!--
