version: '3.8'

services:
  wpaudit:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - FRONTEND_PORT=3000
      - API_PORT=3001
    volumes:
      - ./api/screenshots:/app/api/screenshots
      - ./api/debug.log:/app/api/debug.log
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

