services:
  # Web Service - Combines Frontend + API
  - type: web
    name: justspeedit
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --production=false && npm run build:all && cd api && npm install --production
    startCommand: node start-prod.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PORT
        value: 3001
    healthCheckPath: /api/health

