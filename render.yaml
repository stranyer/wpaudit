services:
  # Web Service - Combines Frontend + API
  - type: web
    name: justspeedit
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --production=false && npm run build:all && echo '==> Build complete, dependencies will install on first start'
    startCommand: node start-prod.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PORT
        value: 3001

